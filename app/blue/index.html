<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI News Generator | Blue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>AI NEWS GENERATOR</h2>
        <span class="version">BLUE DEPLOYMENT</span>
    </header>
    <main>
        <h1>Stay Informed.<br><span>Think Smarter.</span></h1>

            <h2>AI News Summarizer</h2>

            <p id="output">Your summary will appear here.</p>
        </div>

    <footer>AI News Generator | Blue Version | DevSecOps Project</footer>
    <script src="script.js"></script>
